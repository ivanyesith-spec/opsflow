name: OpsFlow local tests (safe)
on:
  push:
    branches: [piloto-norte-3dep]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage 1 permissions
        run: node tests/permisos.test.cjs
      - name: Stage 2 linen bags
        run: node tests/bolsas.test.cjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Stage 2 isolated Chromium UI tests
        run: node tests/ui-bolsas.test.cjs
