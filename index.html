<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OpsFlow</title>
<meta name="description" content="OpsFlow · motor de coordinación operativa · Fase 0 + Fase 1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Lexend:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#EAEFF7; --line:#D8DFEB; --line2:#C5CFDF;
  --text:#0F1A2E; --muted:#58647A; --faint:#8793A8;
  --brand:#1566EE; --brand2:#12AEE6; --brandbg:#E4EEFE; --onbrand:#FFFFFF; --navy:#0B1224;
  --ok:#0F7B57; --okbg:#DFF3EA; --warn:#9A6200; --warnbg:#FBEFD6; --crit:#BF3434; --critbg:#FBE4E4;
  --watch:#6B4FD6; --watchbg:#ECE7FC;
  --shadow:0 1px 2px rgba(15,26,46,.06),0 4px 14px rgba(15,26,46,.05);
  --r:10px;
  --fd:'Lexend','Figtree',system-ui,sans-serif; --fb:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#070D1A; --surface:#0F182B; --surface2:#15213A; --line:#223050; --line2:#2E3E62;
  --text:#E3EAF6; --muted:#93A0B8; --faint:#66748E;
  --brand:#3B8BFF; --brand2:#2BC3F2; --brandbg:#12254A; --onbrand:#FFFFFF;
  --ok:#3CC58E; --okbg:#0D2A20; --warn:#EFB14A; --warnbg:#2D230F; --crit:#FF6E6E; --critbg:#3A1618;
  --watch:#A994FF; --watchbg:#231C45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#070D1A; --surface:#0F182B; --surface2:#15213A; --line:#223050; --line2:#2E3E62;
  --text:#E3EAF6; --muted:#93A0B8; --faint:#66748E;
  --brand:#3B8BFF; --brand2:#2BC3F2; --brandbg:#12254A; --onbrand:#FFFFFF;
  --ok:#3CC58E; --okbg:#0D2A20; --warn:#EFB14A; --warnbg:#2D230F; --crit:#FF6E6E; --critbg:#3A1618;
  --watch:#A994FF; --watchbg:#231C45;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--text);font:15px/1.45 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:1.45rem} h2{font-size:1.05rem} h3{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--fm);font-size:.86em;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.84rem} .tiny{font-size:.76rem}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#E8EEF9;display:flex;align-items:center;gap:12px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand img{width:30px;height:30px;border-radius:8px;display:block}
.brand b{font-family:var(--fd);font-weight:600;font-size:1.08rem;letter-spacing:-.01em}
.brand b span{color:#3BA3FF}
.brand .tn{font-size:.74rem;color:#9FB0CC;border-left:1px solid #2A3857;padding-left:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.clock{display:flex;align-items:center;gap:6px;margin-left:auto;background:#141F38;border:1px solid #243353;border-radius:999px;padding:3px 4px 3px 12px}
.clock .t{font-family:var(--fm);font-size:.95rem;color:#fff}
.clock .l{font-size:.68rem;color:#8EA1C4;text-transform:uppercase;letter-spacing:.07em}
.clock button{background:#223257;border:0;color:#DCE6F7;border-radius:999px;padding:3px 9px;font-size:.78rem;cursor:pointer}
.clock button:hover{background:#2C4070}
.who{display:flex;align-items:center;gap:8px}
.who select{background:#141F38;border:1px solid #243353;border-radius:8px;padding:6px 8px;color:#E8EEF9;max-width:230px;font-size:.86rem}
.bell{position:relative;background:#141F38;border:1px solid #243353;border-radius:8px;width:36px;height:34px;display:grid;place-items:center;cursor:pointer;color:#DCE6F7}
.bell i{position:absolute;top:-5px;right:-5px;background:#FF5A5A;color:#fff;font-style:normal;font-size:.68rem;font-weight:700;border-radius:999px;padding:1px 5px}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100% - 52px)}
.nav{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.nav .sec{margin:14px 10px 6px}
.nav .sec:first-child{margin-top:0}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.on{background:var(--brandbg);color:var(--brand);font-weight:600}
.nav button:focus-visible{outline:2px solid var(--brand)}
.nav .ct{font-size:.72rem;background:var(--critbg);color:var(--crit);border-radius:999px;padding:0 7px;font-weight:700}
main{padding-block:22px 60px;padding-inline:clamp(16px,3vw,32px);min-width:0}
.phone{max-width:460px;margin:0 auto;padding:16px 16px 90px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head p{color:var(--muted);max-width:62ch;margin-top:4px}

/* blocks */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.blk>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.blk>header .q{font-size:.8rem;color:var(--muted);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.crit{background:var(--critbg);color:var(--crit)} .pill.info{background:var(--brandbg);color:var(--brand)} .pill.watch{background:var(--watchbg);color:var(--watch)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item{flex-wrap:wrap}
.item .main{flex:1 1 220px;min-width:0}
.item .t1{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .t2{font-size:.84rem;color:var(--muted)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stripe{width:4px;align-self:stretch;border-radius:4px;background:var(--line)}
.stripe.crit{background:var(--crit)} .stripe.warn{background:var(--warn)} .stripe.ok{background:var(--ok)} .stripe.watch{background:var(--watch)} .stripe.info{background:var(--brand)}
.empty{padding:14px 0 4px;color:var(--muted);font-size:.9rem}
.empty b{color:var(--ok);font-weight:600}
.code{font-family:var(--fm);font-size:.82rem;background:var(--surface2);border-radius:5px;padding:1px 6px;color:var(--text)}

.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
.btn.pri:hover{filter:brightness(1.08);color:var(--onbrand)}
.btn.dng{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn.big{padding:12px 16px;font-size:.98rem;border-radius:10px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:3px 9px;font-size:.78rem}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:99px}
.bar i.ok{background:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td input[type=number]{width:62px}
input[type=text],input[type=email],input[type=number],input[type=time],select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;min-height:150px;font-family:var(--fm);font-size:.85rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.note{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:.86rem;color:var(--muted)}
.note b{color:var(--text)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pct{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:12px}
.pct .v{font-family:var(--fd);font-size:1.5rem;font-weight:600}
.pct .s{font-size:.8rem;color:var(--muted)}

/* phone worker */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
button.card{font:inherit;color:inherit;text-align:left}
.apt{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;text-align:left}
.apt .n{font-family:var(--fm);font-size:.8rem;color:var(--muted);width:22px}
.fronts{display:grid;grid-template-columns:1fr;gap:10px}
.front{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.front.mine{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.front.done{background:var(--okbg);border-color:transparent}
.front .fh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cnt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:.9rem}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:700}
.step b{min-width:34px;text-align:center;font-family:var(--fm)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:15}
.tabs button{all:unset;cursor:pointer;flex:1;max-width:150px;text-align:center;padding:10px 4px;font-size:.8rem;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--brand);box-shadow:inset 0 2px 0 var(--brand)}
.thumb{width:64px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(5,10,22,.55);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal h2{margin-bottom:6px}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;margin-top:8px}
.opt:has(input:checked){border-color:var(--brand);background:var(--brandbg)}
.opt.off{opacity:.5;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
.notes{position:fixed;top:56px;right:12px;width:min(380px,calc(100% - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:30;box-shadow:0 16px 40px rgba(0,0,0,.2);padding:6px 14px}
.photo-full{max-width:100%;border-radius:10px}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px;gap:4px}
  .nav .sec{display:none}
  .nav button{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .brand .tn{display:none}
  .clock{margin-left:0}
}
@media (max-width:520px){.clock .l{display:none}.who select{max-width:190px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="layer"></div>

const dur = m => { m = Math.round(Math.abs(m)); return m < 60 ? m + ' min' : Math.floor(m/60) + ' h' + (m%60 ? ' ' + String(m%60).padStart(2,'0') : ''); };
const parseHM = s => { const r = /^(\d{1,2})[:.h]?(\d{2})$/.exec(String(s||'').trim()); return r ? (+r[1])*60 + (+r[2]) : null; };

/* ---------- 4. Fase 0: composición → dotación, bolsa, frentes y tiempo (§16, §21, §22) ---------- */
function dotacion(p){ const d=p.dobles, s=p.sencillas, b=p.banos; return {sd:d, ss:s, fu:2*d+s, tg:2*d+s, tp:2*d+s, al:b, pa:2*b, sg:b}; }
function bolsa(p){ const x = dotacion(p), o = {}; TEXTIL.forEach(k => { if (x[k]) o[k] = x[k]; }); return o; }   // el shower gel no va en la bolsa
function frentes(p){
  const f = [{id:'gen', n:'General · entrar, basura y cerrar', items:{}}, {id:'coc', n:'Cocina', items:{}}];
  const sala = {id:'sal', n:'Sala y comedor', items:{}}, rooms = [];
  for (let i=0;i<p.hab;i++) rooms.push({id:'h'+(i+1), n:'Habitación '+(i+1), items:{}});
  const beds = [...Array(p.dobles).fill('d'), ...Array(p.sencillas).fill('s')];
  beds.forEach((b,j) => { const it = (rooms.length ? rooms[Math.min(j, rooms.length-1)] : sala).items;
    if (b==='d'){ it.sd=(it.sd||0)+1; it.fu=(it.fu||0)+2; } else { it.ss=(it.ss||0)+1; it.fu=(it.fu||0)+1; } });
  f.push(sala, ...rooms);
  const dt = dotacion(p);
  for (let i=0;i<p.banos;i++){ const it = {};
    ['tg','tp','al','pa','sg'].forEach(k => { const q = Math.floor(dt[k]/p.banos) + (i < dt[k]%p.banos ? 1 : 0); if (q) it[k] = q; });
    f.push({id:'b'+(i+1), n:'Baño '+(i+1), items:it}); }
  return f;
}
function minPersona(p){ const e = S.params.est; return e.base + e.cocina + e.sala + e.bano*p.banos + e.hab*p.hab; }
function factor(n){ return n >= 3 ? S.params.factor[3] : n === 2 ? S.params.factor[2] : 1; }
function viaje(a, b){ const v = S.params.viaje; if (!a) return v.zona; if (a.edificio && a.edificio === b.edificio) return v.edificio; return a.zone === b.zone ? v.zona : v.otra; }

/* ---------- 5. Registro: todo se registra, no todo avisa (§5.8, §5.9) ---------- */
function log(text, o={}){
  S.log.push({id:nid('L'), tenant:S.tenant, date:S.date, t:S.now, text, propId:o.propId||null, userId:o.by||null, chain:o.chain||null, photo:o.photo||null, kind:o.kind||'hecho'});
}
function notify(userId, text, level='normal', o={}){
  if (!userId) return;
  S.notes.push({id:nid('N'), tenant:S.tenant, to:userId, t:S.now, text, level, read:false, propId:o.propId||null});
}
function notifyMany(ids, text, level, o){ [...new Set(ids.filter(Boolean))].forEach(id => notify(id, text, level, o)); }

/* ---------- 6. Motor de reglas: las reglas son datos (§5.2) ---------- */
function emit(type, o){
  const ev = {id:nid('E'), type, t:S.now, ...o};
  const rs = S.rules.filter(r => r.tenant === S.tenant && r.activa && r.evento === type);
  log('Evento · ' + EVENTOS[type] + (rs.length ? ' → ' + rs.map(r => r.id).join(', ') : ' → ninguna regla activa'), {propId:o.propId, by:o.by, chain:o.chain, kind:'evento'});
  rs.forEach(r => ACTIONS[r.crea] && ACTIONS[r.crea](ev, r));
  return ev;
}
const EVENTOS = {
  checkout:'Checkout', bolsa_preparada:'Bolsa preparada', faltante_textil:'Faltante de textil', faltante_consumible:'Faltante de consumible',

const ACTIONS = {
  limpieza(ev, r){
    mkTask({type:'limpieza', dept:'hk', propId:ev.propId, chain:ev.chain, plazo:r.plazo, rule:r.id, teamId:null, order:99, fronts:{}, motivo:'Checkout ' + fm(ev.data.out)});
  },
  picking(ev, r){
    const p = P(ev.propId);
    const b = {id:'B' + (S.seq++).toString().padStart(3,'0'), tenant:S.tenant, propId:p.id, chain:ev.chain, contents:bolsa(p), state:'por_preparar', driverId:null};
    S.bultos.push(b);
    mkTask({type:'picking', dept:'linens', propId:p.id, chain:ev.chain, bultoId:b.id, plazo:r.plazo, rule:r.id, motivo:'Bolsa del checkout'});
  },
  entrega_bulto(ev, r){
    const b = S.bultos.find(x => x.id === ev.data.bultoId);
    mkTask({type:'entrega_bulto', dept:'drivers', propId:b.propId, chain:b.chain, bultoId:b.id, zone:P(b.propId).zone, plazo:r.plazo, rule:r.id, stop:'pendiente', motivo:'Bolsa del checkout · libre hasta que alguien la escanee'});
  },
  /* §6 · La cadena se bifurca, y lo decide un solo dato: el escaneo */
  reposicion(ev, r){
    const inc = INC(ev.data.incidentId), p = P(inc.propId);
    const b = S.bultos.find(x => x.propId === inc.propId && x.chain === inc.chain);
    let caso = 'A';
    if (b && b.state === 'en_van') caso = 'B';
    else if (b && b.state === 'sin_escaneo') caso = 'C';
    inc.caso = caso; inc.status = 'resolucion';
    if (caso === 'B'){
      const t = S.tasks.find(x => x.type === 'entrega_bulto' && x.bultoId === b.id);

function mkTask(o){

/* ---------- 7. Plazos y riesgo: la hora es la de entrega (§5.3, §5.10) ---------- */
function checkin(propId){ const c = S.day.checkouts.find(x => x.propId === propId); return c && c.in != null ? c.in : null; }
function deadline(t){
  if (t.deadline != null) return t.deadline;
  const ci = checkin(t.propId), pr = S.params;
  switch (t.plazo){
    case 'checkin_o_fin': return ci != null ? ci : pr.finTurno;
    case 'inicio_limpieza': return cleaningStart(t.propId, t.chain);
    case 'checkin2h_o_cierre': return ci != null ? Math.max(ci - pr.margenReposicion, t.createdAt) : pr.cierreDia;
    case 'fin_turno': return pr.finTurno;
    default: return pr.cierreDia;
  }
}
function isDone(t){ return t.status === 'hecha' || t.status === 'verificada' || !!t.noHacer; }
function risk(t){
  if (isDone(t)) return null;
  const d = deadline(t), left = d - S.now;
  if (left < 0) return {k:'crit', t:'Vencida hace ' + dur(-left)};
  if (left <= S.params.riesgo) return {k:'warn', t:'En riesgo · quedan ' + dur(left)};
  return null;
}

/* ---------- 8. Equipos, horario y capacidad (§20, §22) ---------- */
function presentes(team){ return team.members.filter(m => !S.day.absent.includes(m) && U(m)?.active); }
function teamTasks(team){ return S.tasks.filter(t => t.tenant === S.tenant && t.type === 'limpieza' && t.teamId === team.id && t.noHacer !== 'capacidad').sort((a,b) => a.order - b.order); }
function schedule(team){
  const pres = presentes(team), n = pres.length, rows = [];
  let t = S.params.inicioTurno, prev = null, travel = 0, mp = 0;
  for (const task of teamTasks(team)){
    const p = P(task.propId), tr = viaje(prev, p), m = minPersona(p), wall = n ? Math.round(m * factor(n)) : Infinity;
    let start, end;
    if ((isDone(task) && task.doneAt != null) || task.closeType === 'nopudo'){ const e = task.doneAt ?? task.blockedAt; start = task.startedAt ?? e - wall; end = e; }
    else if (task.status === 'proceso' || task.status === 'bloqueada'){ start = task.startedAt; end = Math.max(start + wall, S.now + 5); }
    else { start = Math.max(t + tr, S.now); end = start + wall; }
    if (!isDone(task) && task.closeType !== 'nopudo'){ travel += tr; mp += m; }
    rows.push({task, p, tr, m, wall, start, end}); t = end; prev = p;
  }
  return {n, rows, finish: rows.length ? t : null, travel, mp, pres};
}
function cleaningStart(propId, chain){
  const task = S.tasks.find(t => t.type === 'limpieza' && t.propId === propId && t.chain === chain);
  if (!task || !task.teamId) return S.params.inicioTurno + 60;
  const row = schedule(TEAM(task.teamId)).rows.find(r => r.task.id === task.id);
  return row ? row.start : S.params.inicioTurno;
}
function capacidad(){
  const pr = S.params, from = Math.max(S.now, pr.inicioTurno);
  let disp = 0, comp = 0;
  TN(S.teams).forEach(tm => { const sc = schedule(tm); disp += sc.n * Math.max(0, pr.finTurno - from); comp += sc.mp + sc.travel * sc.n; });
  const sinEquipo = hkTasks().filter(t => !t.teamId && !isDone(t));
  sinEquipo.forEach(t => comp += minPersona(P(t.propId)) + pr.viaje.zona);
  return {disp, comp, sinEquipo: sinEquipo.length};
}
const hkTasks = () => S.tasks.filter(t => t.tenant === S.tenant && t.type === 'limpieza');

/* ---------- 9. Estado de la propiedad (§14) ---------- */
function openIncidents(propId){ return S.incidents.filter(i => i.tenant === S.tenant && i.propId === propId && i.status !== 'cerrada'); }
function propState(propId){
  const c = S.tasks.find(t => t.type === 'limpieza' && t.propId === propId && t.tenant === S.tenant);
  const inc = openIncidents(propId);
  if (!c) return inc.length ? {k:'warn', t:'Incidencia abierta'} : {k:'ok', t:'Sin pendientes'};
  if (c.noHacer === 'capacidad') return {k:'crit', t:'Cae del roster · no vendible hoy'};
  if (c.closeType === 'nopudo') return {k:'crit', t:'No se pudo limpiar'};
  if (c.status === 'creada') return c.teamId ? {k:'info', t:'Sucio · en roster'} : {k:'warn', t:'Sucio · sin equipo'};
  if (c.status === 'proceso') return {k:'info', t:'En limpieza'};
  if (inc.length) return {k:'watch', t:'Limpia, falta dotación'};
  return {k:'ok', t:'Lista para huésped'};
}

/* ---------- Operación: la pantalla del día (§9) ---------- */
function opHoyLists(){
  const act = TN(S.tasks).filter(t => ACTIVE.includes(t.dept));
  const sinDue = t => t.type === 'limpieza' ? !t.teamId : !t.ownerId;
  const nadie = act.filter(t => !isDone(t) && !t.answer && ((sinDue(t) && S.now - t.createdAt >= S.params.sinRespuesta * 2) || (t.status === 'bloqueada' && S.now - (t.blockedAt||t.createdAt) >= 30) || risk(t)?.k === 'crit'));
  const noes = act.filter(t => (t.answer && t.answer.kind === 'no') || t.closeType === 'nopudo');
  const falla = act.filter(t => risk(t)?.k === 'warn' && !t.answer);
  const rojas = bolsasSinDueno().filter(x => x.start - S.now <= S.params.rojoBulto);
  return {act, nadie, noes, falla, rojas};
}
function opHoyCount(){ const l = opHoyLists(); return l.nadie.length + l.falla.length + l.rojas.length || 0; }
function vHoy(){
  const {act, nadie, noes, falla, rojas} = opHoyLists();
  const noche = S.now >= S.params.cierreDia ? TN(S.incidents).filter(i => i.status !== 'cerrada') : [];
  const pulse = Object.keys(DEPTS).filter(d => !['op','own'].includes(d)).map(d => {
    const ts = act.filter(t => t.dept === d), on = ACTIVE.includes(d);
    return `<div class="item"><div class="main"><div class="t1">${DEPTS[d]}</div></div><div class="small num ${on ? '' : 'faint'}">${on ? `entró ${ts.length} · cerró ${ts.filter(isDone).length} · abierto ${ts.filter(t => !isDone(t)).length}` : (['mto','pm','bodega'].includes(d) ? 'Fase 3' : d === 'cal' ? 'Fase 5' : 'Fase 4')}</div></div>`;
  }).join('');
  return `<div class="head"><div><div class="lbl">Operación · ${esc(S.date)}</div><h1>Lo que necesita a alguien</h1><p>La información sube sola; la pregunta no baja. Lo que va bien no está aquí: se consulta si hace falta. La meta es esta pantalla vacía.</p></div></div>
  <div class="grid2">
    ${blk('1 · Lo que nadie ha contestado', 'Parado sin que el líder haya dicho por qué sigue abierto ni que no se hace. Es lo único tuyo de verdad.', nadie.length ? `<div class="list">${nadie.map(t => taskLine(t, `<button class="btn sm" data-act="answer" data-id="${t.id}">Responder</button>`, ' · abierto ' + dur(S.now - t.createdAt))).join('')}</div>` : empty('Todo tiene respuesta.'), nadie.length)}
    ${blk('2 · Los «no» de hoy, con su motivo', 'No para revocarlos: para saber qué pasa y para que se cuenten.', noes.length ? `<div class="list">${noes.map(t => taskLine(t)).join('')}</div>` : '<div class="empty">Ningún «no» hoy.</div>')}
    ${blk('3 · Todavía no falló, pero va a fallar', 'El único bloque donde actuar antes sirve.', (falla.length || rojas.length || noche.length) ? `<div class="list">${rojas.map(({t, start}) => `<div class="item"><span class="stripe crit"></span><div class="main"><div class="t1">Bolsa sin dueño · ${propLbl(t.propId)}</div><div class="t2">La limpieza empieza a las ${fm(start)} y nadie la ha escaneado</div></div></div>`).join('')}${falla.map(t => taskLine(t)).join('')}${noche.map(i => `<div class="item"><span class="stripe crit"></span><div class="main"><div class="t1">Dotación pendiente a las ${fm(S.params.cierreDia)} · ${propLbl(i.propId)}</div><div class="t2">${esc(itemsTxt(i.items))} · ninguna dotación pasa la noche</div></div></div>`).join('')}</div>` : empty('Nada a punto de fallar.'), falla.length + rojas.length + noche.length)}
    ${blk('4 · El pulso de las casas', 'Una línea por casa. Sin nombres y sin detalle.', `<div class="list">${pulse}</div>`)}
  </div>`;
}
function vProps(){
  const rows = TN(S.props).map(p => {
    const c = S.tasks.find(t => t.type === 'limpieza' && t.propId === p.id && t.tenant === S.tenant);

}

const VIEWS = {tablero:vTablero, roster:vRoster, stock:vStock, tomado:vTomado, crear:vCrear, hist:vHist, hoy:vHoy, props:vProps, casas:vCasas, cargar:vCargar, censo:vCenso, personas:vPersonas, reglas:vReglas, marca:vMarca, demo:vDemo};
/* =====================================================================
   13. Pantallas de campo (teléfono): solo lo suyo (§11)
   ===================================================================== */
function workerView(u){
  const tabs = u.dept === 'drivers' ? [['base','Base'], ['ruta','Mi ruta'], ['avisos','Avisos']] : u.dept === 'hk' ? [['dia','Mi día'], ['avisos','Avisos']] : [['tareas','Mis tareas'], ['avisos','Avisos']];
  let v = ui.view[u.id]; if (!tabs.some(t => t[0] === v)) v = ui.view[u.id] = tabs[0][0];
  let body;
  if (v === 'avisos') body = avisosList(u);
  else if (u.dept === 'hk') body = ui.open ? aptView(u, TK(ui.open)) : cleanerDay(u);
  else if (u.dept === 'drivers') body = v === 'base' ? driverBase(u) : driverRoute(u);
  else if (u.dept === 'linens') body = linensWorker(u);
  else body = `<div class="card"><h2>${DEPTS[u.dept]}</h2><p class="muted" style="margin-top:6px">Las pantallas de esta casa entran en fases posteriores. Tu cuenta ya existe y tiene su rol.</p>${manualMine(u)}</div>`;
  return `<div class="phone">${body}</div><nav class="tabs">${tabs.map(([k,t]) => `<button class="${k === v ? 'on' : ''}" data-act="go" data-v="${k}">${t}</button>`).join('')}</nav>`;
}
function avisosList(u){
  const ns = TN(S.notes).filter(n => n.to === u.id).slice().reverse();
  return `<h1 style="margin-bottom:12px">Avisos</h1>${ns.length ? `<div class="card"><div class="list">${ns.map(n => `<div class="item"><span class="stripe ${n.level === 'alta' ? 'crit' : 'info'}"></span><div class="main"><div class="t1" style="font-weight:${n.read ? 500 : 700}">${esc(n.text)}</div><div class="t2 mono">${fm(n.t)}</div></div></div>`).join('')}</div></div>` : '<p class="muted">Sin avisos.</p>'}`;
}
function manualMine(u){
  const ts = TN(S.tasks).filter(t => t.type === 'manual' && t.ownerId === u.id && !isDone(t));
  if (!ts.length) return '';
  return `<div class="lbl" style="margin:16px 0 6px">Otros trabajos</div><div class="card"><div class="list">${ts.map(t => `<div class="item"><div class="main"><div class="t1">${propLbl(t.propId)}</div><div class="t2">${esc(t.what)} · antes de las ${fm(deadline(t))}</div></div><button class="btn sm pri" data-act="manualDone" data-id="${t.id}">Hecho</button></div>`).join('')}</div></div>`;
}

/* --- Limpieza --- */
function myTeam(u){ return TN(S.teams).find(t => t.members.includes(u.id)); }
function cleanerDay(u){
  const tm = myTeam(u);
  if (!tm) return `<div class="card"><h2>Hola, ${esc(nm(u.id))}</h2><p class="muted">No estás en ningún equipo hoy.</p></div>`;
  if (S.day.absent.includes(u.id)) return `<div class="card"><h2>Hola, ${esc(nm(u.id))}</h2><p class="muted">Hoy figuras como ausente. Si es un error, avisa a tu líder.</p></div>`;
  const sc = schedule(tm);
  return `<div class="lbl">${esc(tm.name)} · ${tm.resp === u.id ? 'eres responsable' : 'responsable: ' + esc(nm(tm.resp))}</div>
  <h1 style="margin:2px 0 14px">${sc.rows.filter(r => isDone(r.task)).length} de ${sc.rows.length}</h1>
  ${!S.day.published ? '<div class="note" style="margin-bottom:12px">El roster todavía no está publicado. El orden puede cambiar.</div>' : ''}
  <div class="stack">${sc.rows.map((r, i) => { const st = propState(r.p.id);
    return `<button class="card apt" data-act="openApt" data-id="${r.task.id}"><span class="n">${i+1}</span><span class="main" style="flex:1;min-width:0"><span class="t1" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${code(r.p.id)} <b>${esc(r.p.name)}</b></span><span class="t2 small muted" style="display:block">${fm(r.start)} · ${esc(r.p.dir)}${checkin(r.p.id) != null ? ' · check-in ' + fm(checkin(r.p.id)) : ''}</span></span>${pill(st.k, isDone(r.task) ? (r.task.closeType === 'falta' ? 'Falta dotación' : 'Cerrado') : r.task.status === 'proceso' ? 'En curso' : r.task.status === 'bloqueada' ? 'No se pudo' : 'Pendiente')}</button>`; }).join('') || '<p class="muted">Sin apartamentos asignados todavía.</p>'}</div>${manualMine(u)}`;
}
function aptView(u, t){
  if (!t) { ui.open = null; return cleanerDay(u); }
  const p = P(t.propId), tm = TEAM(t.teamId), resp = tm.resp === u.id, fs = frentes(p);
  const head = `<button class="btn sm" data-act="closeApt">← Mi día</button>
    <div style="margin:12px 0 14px"><div class="lbl">${esc(p.zone)} · ${p.dobles} dobles · ${p.sencillas} sencillas · ${p.banos} baños</div><h1>${esc(p.id)} · ${esc(p.name)}</h1>
    <p class="small muted">${esc(p.dir)} · <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.dir)}" target="_blank" rel="noopener">Navegar</a>${checkin(p.id) != null ? ' · check-in ' + fm(checkin(p.id)) : ''}</p></div>`;
  if (t.status === 'creada') return head + `<div class="card"><p>Al llegar, escanea el QR de la puerta. Marca la hora real de inicio.</p><div style="margin-top:12px"><button class="btn pri big" data-act="arrive" data-id="${t.id}">He llegado · escanear QR</button></div></div>`;
  if (t.status === 'bloqueada') return head + `<div class="card"><h2>No se pudo</h2><p class="muted" style="margin-top:4px">${esc(t.blockReason)}. Tu líder ya lo sabe.</p></div>`;
  const ver = TN(S.incidents).filter(i => i.chain === t.chain && i.porVerificar && i.status !== 'cerrada');
  const inc = TN(S.incidents).filter(i => i.chain === t.chain);
  let out = head;
  if (ver.length) out += `<div class="card" style="margin-bottom:12px;border-color:var(--watch)"><div class="lbl">Llegó la reposición</div>${ver.map(i => { const ev = i.taskIds.map(TK).find(x => x && x.evidence); return `<div class="item">${ev ? thumb(ev.evidence.photo) : ''}<div class="main"><div class="t1">${esc(itemsTxt(i.items))}</div><div class="t2">La dejó ${nm(ev?.evidence.by)} a las ${fm(ev?.evidence.t)}. ¿Está dentro?</div></div><button class="btn sm pri" data-act="verify" data-id="${i.id}">Sí, está</button></div>`; }).join('')}</div>`;
  if (isDone(t)) return out + `<div class="card"><h2>${t.closeType === 'falta' ? 'Limpia, falta dotación' : 'Cerrado'}</h2><p class="muted small" style="margin-top:4px">Firmado por ${esc(nm(t.doneBy))} a las ${fm(t.doneAt)} · llave: ${esc(t.key)}</p>${inc.length ? `<div class="list" style="margin-top:8px">${inc.map(i => `<div class="item"><div class="main"><div class="t1">${esc(itemsTxt(i.items))}</div><div class="t2">${esc(i.front)}</div></div>${inPill(i)}</div>`).join('')}</div>` : ''}</div>`;
  out += `<div class="lbl" style="margin-bottom:6px">Frentes · toca el que empiezas</div><div class="fronts">${fs.map(f => frontCard(u, t, f, resp)).join('')}</div>`;
  const open = fs.filter(f => t.fronts[f.id]?.st !== 'hecho');
  out += `<div class="card" style="margin-top:14px">${resp
    ? `<button class="btn pri big" data-act="sign" data-id="${t.id}" ${open.length ? 'disabled' : ''}>Firmar el cierre</button>${open.length ? `<p class="small muted" style="margin-top:8px">Falta: ${open.map(f => esc(f.n) + (t.fronts[f.id]?.st ? ' (' + esc(nm(t.fronts[f.id].by)) + ')' : ' (libre)')).join(' · ')}</p>` : ''}`
    : `<p class="small muted">El cierre lo firma ${esc(nm(tm.resp))}, el responsable del equipo. El trabajo se reparte; la responsabilidad no.</p>`}
    <div style="margin-top:10px"><button class="btn dng" data-act="nopudo" data-id="${t.id}">No se pudo</button></div></div>`;
  return out;
}
function frontCard(u, t, f, resp){
  const fr = t.fronts[f.id], mine = fr && fr.by === u.id && fr.st === 'tomado';
  if (!fr || !fr.st) return `<div class="front"><div class="fh"><b>${esc(f.n)}</b><button class="btn sm pri" data-act="take" data-id="${t.id}" data-f="${f.id}">Tomar</button></div></div>`;
  if (fr.st === 'hecho') return `<div class="front done"><div class="fh"><b>${esc(f.n)}</b><span class="small">✓ ${esc(nm(fr.by))} · ${fm(fr.t1)}</span></div></div>`;
  if (!mine) return `<div class="front"><div class="fh"><b>${esc(f.n)}</b><span class="small muted">Lo tiene ${esc(nm(fr.by))}${resp ? ` <button class="btn sm" data-act="release" data-id="${t.id}" data-f="${f.id}">Liberar</button>` : ''}</span></div></div>`;
  const rows = Object.entries(f.items).map(([k, q]) => {
    const c = fr.counts[k] ?? q, rep = fr.rep[k] || 0, missing = q - c - rep;
    return `<div class="cnt"><span>${ITEMS[k]} <span class="faint tiny">debe haber ${q}</span></span><span class="step"><button data-act="cnt" data-id="${t.id}" data-f="${f.id}" data-i="${k}" data-d="-1" aria-label="Menos">−</button><b>${c}</b><button data-act="cnt" data-id="${t.id}" data-f="${f.id}" data-i="${k}" data-d="1" aria-label="Más">+</button></span></div>
      ${missing > 0 ? `<button class="btn sm dng" style="margin:2px 0 6px" data-act="falta" data-id="${t.id}" data-f="${f.id}" data-i="${k}">Avisar ya: faltan ${missing} × ${ITEMS[k]}</button>` : ''}${rep ? `<div class="tiny muted">Enviado: ${rep} × ${ITEMS[k]}</div>` : ''}`;
  }).join('');
  return `<div class="front mine"><div class="fh"><b>${esc(f.n)}</b>${pill('info','Tuyo')}</div>${rows ? `<div style="margin-top:6px">${rows}</div>` : '<p class="tiny muted" style="margin-top:4px">Sin dotación que contar en este frente.</p>'}
    <div style="margin-top:8px"><button class="btn sm pri" data-act="finishFront" data-id="${t.id}" data-f="${f.id}">Terminar con foto</button></div></div>`;
}

/* --- Linens --- */
function linensWorker(u){
  const ts = deptTasks('linens').filter(t => !isDone(t) && (t.ownerId === u.id || !t.ownerId)).sort((a,b) => deadline(a) - deadline(b));
  return `<div class="lbl">Linens · ${esc(u.name)}</div><h1 style="margin:2px 0 14px">${ts.length} por preparar</h1>
  <div class="stack">${ts.map(t => { const b = t.bultoId ? S.bultos.find(x => x.id === t.bultoId) : null, r = risk(t);
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>${TTYPE[t.type]} · ${esc(t.propId)}</b>${r ? pill(r.k, r.t) : pill('', 'antes de ' + fm(deadline(t)))}</div>
      <p class="small muted" style="margin-top:4px">${b ? 'Bolsa ' + b.id + ' · ' : ''}${esc(itemsTxt(b ? b.contents : t.items))}${t.ownerId ? '' : ' · sin asignar'}</p>
      <div style="margin-top:10px"><button class="btn pri" data-act="prep" data-id="${t.id}">Preparada</button></div></div>`; }).join('') || '<p class="muted">Nada pendiente.</p>'}</div>${manualMine(u)}`;
}

/* --- Drivers --- */
function driverBase(u){
  const free = deptTasks('drivers').filter(t => !isDone(t) && !t.ownerId).map(t => ({t, start: t.type === 'entrega_bulto' ? cleaningStart(t.propId, t.chain) : deadline(t)})).sort((a,b) => (b.t.zone === u.zone) - (a.t.zone === u.zone) || a.start - b.start);
  const prep = S.bultos.filter(b => b.tenant === S.tenant && b.state === 'por_preparar' && P(b.propId).zone === u.zone);
  return `<div class="lbl">Base · zona ${esc(u.zone)}</div><h1 style="margin:2px 0 6px">Escanea lo que cargas</h1><p class="small muted" style="margin-bottom:14px">El escaneo es la asignación y descuenta el stock en ese momento. Lo que no cabe se queda sin escanear: es la carga 2.</p>
  <div class="stack">${free.map(({t, start}) => { const b = t.bultoId ? S.bultos.find(x => x.id === t.bultoId) : null, red = t.type === 'entrega_bulto' && start - S.now <= S.params.rojoBulto;
    return `<div class="card"><div class="row" style="justify-content:space-between"><b>${b ? 'Bolsa ' + b.id : TTYPE[t.type]} · ${esc(t.propId)}</b>${red ? pill('crit','Limpieza ' + fm(start)) : pill(t.zone === u.zone ? 'info' : '', 'Zona ' + t.zone)}</div>
      <p class="small muted" style="margin-top:4px">${esc(itemsTxt(b ? b.contents : t.items))}</p>
      <div style="margin-top:10px"><button class="btn pri" data-act="scan" data-id="${t.id}">Escanear</button></div></div>`; }).join('') || '<p class="muted">No hay nada libre en base.</p>'}</div>
  ${prep.length ? `<p class="small muted" style="margin-top:12px">${prep.length} bolsas de tu zona siguen en linens sin preparar.</p>` : ''}${manualMine(u)}`;
}
function driverRoute(u){
  const ts = deptTasks('drivers').filter(t => t.ownerId === u.id && !isDone(t)).sort((a,b) => (a.route ?? deadline(a)) - (b.route ?? deadline(b)));
  const done = deptTasks('drivers').filter(t => t.ownerId === u.id && isDone(t)).length;
  const NEXT = {pendiente:['camino','En camino'], camino:['llegado','He llegado'], llegado:['deliver','Entregar con foto']};

  r.readAsDataURL(file);

  ractiva: el => { const r = S.rules.find(x => x.id === el.dataset.id && x.tenant === S.tenant); r.activa = el.checked; log(`Regla ${r.id} ${r.activa ? 'activada' : 'desactivada'}`, {by:S.userId, kind:'sistema'}); },
  brand: el => { S.brandName = el.value.trim() || BRAND.name; },
  photoFile: el => { const f = el.files && el.files[0]; if (f) readPhoto(f, usePhoto); return 'skip'; }
};
const FORMS = {
  crear: fd => { const t = mkTask({type:'manual', dept:fd.dept, propId:fd.prop, what:fd.what, deadline:parseHM(fd.time), motivo:fd.motivo, createdBy:S.userId, chain:'W·' + fd.prop + '·' + S.date + '·' + S.seq});
    notify(leaderOf(fd.dept)?.id, `${fd.prop}: trabajo nuevo de ${nm(S.userId)} — ${fd.what} (antes de ${fd.time}).`, 'normal', {propId:fd.prop}); toast('Trabajo creado · su líder decide quién lo hace'); },
  prop: fd => { const id = fd.id.trim().toUpperCase(); if (P(id)) return toast('Ese código ya existe en el censo.');
    S.props.push({id, tenant:S.tenant, name:fd.name, zone:fd.zone, dobles:+fd.dobles||0, sencillas:+fd.sencillas||0, banos:Math.max(1, +fd.banos||1), hab:+fd.hab||0, dir:fd.name, active:true}); log(`Alta en el censo: ${id}`, {propId:id, by:S.userId, kind:'sistema'}); toast('Propiedad dada de alta'); },
  user: fd => { const id = 'u' + (S.seq++); S.users.push({id, tenant:S.tenant, name:fd.name, email:fd.email, dept:fd.dept, role:fd.role, zone:fd.zone || null, active:true}); log(`Cuenta creada: ${fd.name} · ${DEPTS[fd.dept]} · ${ROLES[fd.role]}`, {by:S.userId, kind:'sistema'}); toast('Cuenta creada'); },
  tenant: fd => { const id = 't' + (S.seq++); S.tenants.push({id, name:fd.name}); S.users.push({id:'op_' + id, tenant:id, name:'Operación · ' + fd.name, email:'operacion@' + id + '.demo', dept:'op', role:'op', admin:true, active:true});
    ['R1','R2','R3','R4','R5','R6','R7'].forEach(rid => { const r = S.rules.find(x => x.id === rid && x.tenant === S.tenant); if (r) S.rules.push({...r, tenant:id}); }); toast('Cliente creado, con sus reglas por defecto y sin datos'); }
};

function render(){
  if (!me() || me().tenant !== S.tenant) S.userId = TN(S.users).find(u => u.active)?.id;
  document.title = S.brandName;
  document.getElementById('app').innerHTML = topbar() + (me().role === 'worker' ? workerView(me()) : shell(me()));
  renderLayer();
  const n = altaCount(); if (n > (ui.lastAlta ?? n)) beep(); ui.lastAlta = n;
  save();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); if (r){ const s = JSON.parse(r); if (s && s.v === VER){ S = s; return; } } }catch(e){} seed(); }

document.addEventListener('click', e => {
  if (!ui.audio){ try{ ui.audio = new (window.AudioContext || window.webkitAudioContext)(); }catch(err){ ui.audio = null; } }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  const r = fn(el.dataset, el, e);
  if (r !== 'skip') render();
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]'); if (!el) return;
  const r = CHG[el.dataset.chg](el); if (r !== 'skip') render();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  FORMS[f.dataset.form](Object.fromEntries(new FormData(f))); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && (ui.modal || ui.notes)){ ui.modal = null; ui.notes = false; renderLayer(); } });

load(); render();

</script>
